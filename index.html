:root{
  --blue:#00E5FF;
  --ocean:#0077B6;
  --ocean-dark:#005A8A;
  --lime:#7ED957;
  --green:#0077B6;
  --green-dark:#005A8A;
  --green-soft:#E6F7FF;
  --orange:#FFB81C;
  --orange-soft:#FFF6DE;
  --ink:#0B2233;
  --muted:#465A68;
  --surface:#FFFFFF;
  --bg:#F6FBFE;
  --line:#DCECF2;
  --gold:#FFB81C;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:24px;
  --space-1:8px;
  --space-2:16px;
  --space-3:24px;
  --z-header:40;
  --z-sheet:60;
  --z-floating:70;
  --z-modal:80;
  --z-chat:100;
  --z-toast:90;
}

@media (prefers-color-scheme: dark){
  :root{
    --blue:#00E5FF;
    --ocean:#2FB9E8;
    --ocean-dark:#0077B6;
    --lime:#7ED957;
    --green:#2FB9E8;
    --green-dark:#0077B6;
    --green-soft:#0E2A3D;
    --orange:#FFB81C;
    --orange-soft:#2A2210;
    --ink:#EFF8FC;
    --muted:#A9BECB;
    --surface:#122A3A;
    --bg:#0A1B27;
    --line:#254052;
    --gold:#FFB81C;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Hind Siliguri",system-ui,-apple-system,Segoe UI,sans-serif;
  overflow-x:clip;
  overflow-wrap:break-word
}

img,svg,video{
  max-width:100%;
  height:auto
}

img{
  loading:lazy
}

h1{
  font-size:clamp(28px,5vw,44px);
  line-height:1.05;
  overflow-wrap:break-word
}

h2{
  font-size:clamp(20px,3.4vw,28px);
  line-height:1.15;
  overflow-wrap:break-word
}

h3{
  overflow-wrap:break-word
}

p,li,span,button,label{
  overflow-wrap:break-word;
  word-break:break-word
}

.font-display{
  font-family:"Fraunces","Hind Siliguri",serif
}

button{
  font-family:inherit;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease
}

button:hover{
  filter:brightness(1.02)
}

button:active,a:active{
  transform:scale(.97)
}

button[class*="rounded-full"]:active{
  transform:scale(.95)
}

input,select,textarea{
  font-family:inherit;
  font-size:16px;
  min-width:0;
  max-width:100%;
  width:100%
}

label select{
  width:auto;
  max-width:100%
}

form.flex input,form.flex select{
  flex:1 1 0%;
  width:auto
}

.flex > input,.flex > select{
  flex:1 1 0%;
  width:auto
}

.flex > input.w-20,.flex > input.w-24{
  flex:0 0 auto
}

input[type="checkbox"],input[type="radio"]{
  width:20px;
  height:20px;
  min-width:20px;
  flex:none
}

button,a,[role="button"]{
  min-height:44px
}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--ocean);
  outline-offset:2px;
  border-radius:8px
}

button:focus:not(:focus-visible),a:focus:not(:focus-visible){
  outline:none
}

button[class*="rounded-full"]{
  min-height:36px
}

button[aria-label="Favorite"]{
  width:44px !important;
  height:44px !important;
  min-width:44px;
  min-height:44px;
  flex:none
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.chip-active{
  background:var(--ink);
  color:#fff!important;
  border-color:var(--ink)!important
}

/* One consistent card / badge / toast language */

article{
  overflow:hidden;
  min-width:0;
  border-radius:var(--radius-md)
}

@keyframes ekota-pulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.04)
  }
}

@keyframes ai-pulse-ring{
  0%{
    transform:scale(1);
    opacity:.55
  }

  70%{
    transform:scale(1.28);
    opacity:0
  }

  100%{
    transform:scale(1.28);
    opacity:0
  }
}

.ai-pulse-ring{
  position:absolute;
  inset:0;
  border-radius:9999px;
  border:2px solid #00E5FF;
  animation:ai-pulse-ring 2.2s ease-out infinite;
  pointer-events:none
}

.ai-float-shadow{
  box-shadow:0 10px 24px rgba(0,119,182,.38),0 4px 10px rgba(0,229,255,.28)
}

.ai-label-pill{
  box-shadow:0 8px 20px rgba(11,34,51,.18)
}

@media (prefers-reduced-motion:reduce){
  .ai-pulse-ring{
    animation:none
  }
}

@keyframes ekota-fade{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.animate-ekota{
  animation:ekota-fade .45s ease both
}

.animate-pulse-logo{
  animation:ekota-pulse 1.6s ease-in-out infinite
}

@media (prefers-reduced-motion:reduce){
  .animate-ekota,.animate-pulse-logo{
    animation:none
  }

  html{
    scroll-behavior:auto
  }
}

.fluid-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));
  gap:var(--space-2)
}

.store-visual{
  display:block;
  flex:none
}

article h3{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}

article p{
  overflow-wrap:break-word
}

.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  max-width:100%
}

table{
  border-collapse:collapse;
  min-width:560px;
  width:100%
}

table th,table td{
  padding:12px 8px;
  text-align:left;
  vertical-align:top;
  white-space:normal
}

table th:first-child,table td:first-child{
  position:sticky;
  left:0;
  background:var(--surface);
  z-index:1;
  min-width:140px
}

[role="dialog"] > div{
  max-height:90vh;
  max-height:90dvh;
  overflow-y:auto
}

[role="dialog"]{
  align-items:flex-end
}

@media (min-width:640px){
  [role="dialog"]{
    align-items:center
  }
}

[role="dialog"] button[aria-label*="Close"]{
  min-width:44px;
  min-height:44px
}

header{
  z-index:var(--z-header)
}

footer{
  padding-bottom:calc(104px + env(safe-area-inset-bottom))
}

footer button,footer a{
  min-height:44px
}

.skeleton{
  background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);
  background-size:200% 100%;
  animation:skeleton 1.4s infinite;
  border-radius:12px;
  min-height:16px
}

@keyframes skeleton{
  from{
    background-position:200% 0
  }

  to{
    background-position:-200% 0
  }
}

@media (max-width:380px){
  .logo-sub{
    display:none
  }

  .search-pill{
    flex-wrap:wrap;
    border-radius:24px
  }

  .search-pill input{
    flex:1 1 100%;
    order:-1;
    min-width:0
  }

  .search-pill button{
    min-width:44px;
    min-height:44px
  }

  .loc-pill{
    white-space:normal;
    line-height:1.3;
    max-width:100%
  }

  header{
    padding-left:0;
    padding-right:0
  }

  main{
    padding-left:12px !important;
    padding-right:12px !important
  }
}

@media (max-width:360px){
  h1{
    font-size:clamp(26px,8vw,32px)
  }
}

@media (min-width:1920px){
  main,header > div,footer > div{
    max-width:1440px
  }
}
